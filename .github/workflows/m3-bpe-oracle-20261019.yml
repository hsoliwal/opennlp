name: M3 BPE prepared-pair oracle repair
on:
  push:
    branches:
      - work/apply-canonical-opennlp-recipes-20261018
  pull_request:
    paths:
      - 'm3/recipes/bpe-end-of-word-oracle-20261019/**'
      - 'opennlp-core/opennlp-runtime/src/test/java/opennlp/tools/tokenize/M3BpePreparedPairLookupTest.java'
      - '.github/workflows/m3-bpe-oracle-20261019.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Recipe self-test and fixed point
        shell: bash
        run: |
          set -euo pipefail
          java m3/recipes/bpe-end-of-word-oracle-20261019/RepairBpeEndOfWordOracle.java --self-test
          java m3/recipes/bpe-end-of-word-oracle-20261019/RepairBpeEndOfWordOracle.java --check opennlp-core/opennlp-runtime/src/test/java/opennlp/tools/tokenize/M3BpePreparedPairLookupTest.java
          test "$(git hash-object opennlp-core/opennlp-runtime/src/test/java/opennlp/tools/tokenize/M3BpePreparedPairLookupTest.java)" = "d52c687aa38683017709c90a9ddc8df9cb66d5cf"
      - name: Focused BPE Java 21 tests
        run: mvn -B -ntp -pl opennlp-core/opennlp-runtime -am -Dtest=M3BpePreparedPairLookupTest -Dsurefire.failIfNoSpecifiedTests=false test
